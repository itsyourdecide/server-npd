{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sign in · NPD Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/tabler/css/tabler.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
  </head>
  <body class="d-flex flex-column bg-surface-secondary">
    <div class="page page-center">
      <div class="container container-tight py-4">
        <div class="text-center mb-4">
          <a href="{% url 'login' %}" class="portal-auth-brand">
            <span class="portal-brand-mark portal-brand-mark-lg">N</span>
            <span>NPD Portal</span>
          </a>
          <div class="text-secondary mt-2">Access to the NPD compute cluster</div>
        </div>
        {% block content %}{% endblock %}
      </div>
    </div>
    <script src="{% static 'vendor/tabler/js/tabler.min.js' %}"></script>
  </body>
</html>
