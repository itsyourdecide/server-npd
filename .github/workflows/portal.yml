name: Portal checks

on:
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal.yml"
  push:
    paths:
      - "portal/**"
      - ".github/workflows/portal.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/pyproject.toml

      - name: Install portal
        run: python -m pip install --editable .

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        run: python manage.py test --settings=config.settings.test
