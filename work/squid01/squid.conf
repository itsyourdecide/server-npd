# Managed by NPD bootstrap. CVMFS-focused HTTP cache.

acl localnet src 10.10.80.0/24
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8000
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access allow localnet
http_access deny all

http_port 3128

cache_dir ufs /var/spool/squid 40960 16 256
maximum_object_size 1024 MB
cache_mem 256 MB
maximum_object_size_in_memory 8 MB
cache_replacement_policy heap LFUDA
memory_replacement_policy heap GDSF

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid

refresh_pattern ^http://.*\.cvmfs/ 1440 80% 10080 override-expire override-lastmod reload-into-ims ignore-reload
refresh_pattern . 0 20% 4320

visible_hostname squid01.internal
via on
forwarded_for delete
